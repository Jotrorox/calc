[package]
name = "calc-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "A bounded HTTP API with a project-owned calculation engine"

[workspace]
members = ["."]
default-members = ["."]
resolver = "3"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rug = { version = "1.30", default-features = false, features = ["float", "complex", "integer", "std"] }
gmp-mpfr-sys = { version = "1.7", default-features = false, features = ["mpfr", "mpc", "c-no-tests"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
