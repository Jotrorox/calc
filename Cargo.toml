[package]
name = "calc-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "A bounded HTTP API for the Kalker calculation engine"

[workspace]
members = ["vendor/kalk"]
default-members = ["."]
resolver = "3"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
kalk = { path = "vendor/kalk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
